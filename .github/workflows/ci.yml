name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: frontend gate (lint, types, tests, theme, secrets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: frontend/uv.lock
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Gate
        # --check-only: CI compares against the committed baseline, never rewrites it.
        run: ./run check --check-only

  package:
    name: theme zip and console bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Theme zip (the committed theme; LICENSE is inside the folder)
        run: |
          mkdir -p dist
          (cd themes && zip -r "${GITHUB_WORKSPACE}/dist/n64-classic-mini-theme.zip" n64-classic-mini)
      - name: Console bundle (the same build as `./run stick`, including the Torch tool)
        working-directory: frontend
        run: |
          ./run bundle "${GITHUB_WORKSPACE}/dist/n64mini-bundle"
          cp ../LICENSE "${GITHUB_WORKSPACE}/dist/n64mini-bundle/"
          tar -C "${GITHUB_WORKSPACE}/dist" -czf "${GITHUB_WORKSPACE}/dist/n64mini-bundle.tar.gz" n64mini-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: es-theme-n64-classic-mini-build
          path: |
            dist/n64-classic-mini-theme.zip
            dist/n64mini-bundle.tar.gz
          if-no-files-found: error

  release:
    # Only main publishes, and only after the gate passed. The `latest` tag is moved to this
    # commit each time so the release's source archives match its assets; the README links use
    # releases/latest/download/.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: es-theme-n64-classic-mini-build
          path: dist
      - name: Move the latest tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: latest
          name: Latest build (main)
          make_latest: "true"
          files: |
            dist/n64-classic-mini-theme.zip
            dist/n64mini-bundle.tar.gz

  audit:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: frontend/uv.lock
      - run: uv sync --locked
      - run: ./run audit
