<?xml version="1.0"?>
<!-- N64 Classic Mini (AC-T15): every N64 launch goes through n64mini-launch.sh. It runs the game's
     native port when its card is flipped to Port, and otherwise hands Batocera's emulatorlauncher
     exactly the arguments the stock command gives it (frontend/vendor/batocera-43.1). The engine
     merges this file into its own n64 entry, replacing only the tags given here
     (SystemData::loadAdditionnalConfig): <command>, and <extension>, which adds .n64mini for the
     Showcase/Full card (AC-T14) to the stock list. -->
<systemList>
  <system>
    <name>n64</name>
    <extension>.z64 .n64 .v64 .zip .7z .n64mini</extension>
    <command>/userdata/system/n64mini/python/n64mini/console/data/n64mini-launch.sh %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
  </system>
</systemList>
